apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-app
    
  template:
    metadata:
      labels:
        app: flask-app
      
    spec:
      containers:
        - name: flask-app
          image: agrawalkartik136/flask-cicd-app:latest
          imagePullPolicy: Always

          ports:
           - containerPort: 5000

          envFrom:
            - configMapRef:
                name: flask-config
            - secretRef:
                name: flask-secret
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          

  
